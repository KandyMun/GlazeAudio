# Builds the React frontend and deploys it to Azure Static Web Apps.
# Runs on every push to main that changes the frontend (web/) and can be started by hand.
#
# Needs (Settings -> Secrets and variables -> Actions), set by infra/azure-deploy-setup.sh:
#   secret   AZURE_STATIC_WEB_APPS_API_TOKEN   deployment token of the Static Web App
#   variable API_URL                           https://<api-app>.azurewebsites.net (baked into the build)
name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true
