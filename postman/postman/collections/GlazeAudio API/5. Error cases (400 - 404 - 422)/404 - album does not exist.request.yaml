$kind: http-request
url: "{{baseUrl}}/api/albums/999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 404 Not Found", () => pm.response.to.have.status(404));
      pm.test("Content-Type is JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/(problem\+)?json/));
      pm.test("Problem details body", () => pm.expect(pm.response.json().title).to.eql("Album not found."));
    language: text/javascript
order: 1000
