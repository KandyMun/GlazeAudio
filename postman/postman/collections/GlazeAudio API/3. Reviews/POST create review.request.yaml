$kind: http-request
url: "{{baseUrl}}/api/albums/{{albumId}}/songs/{{songId}}/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": {{userId}},
      "lyricsRating": 4,
      "melodyRating": 5,
      "moodRating": 5,
      "expressivenessRating": 4,
      "comment": "The layered guitars build into something huge by the end."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201 Created", () => pm.response.to.have.status(201));
      pm.test("Content-Type is JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/(problem\+)?json/));
      const b = pm.response.json();
      pm.test("Overall rating is the average of 4 aspects", () => pm.expect(b.overallRating).to.eql(4.5));
      pm.test("Linked to its author", () => { pm.expect(b.userId).to.eql(Number(pm.collectionVariables.get("userId"))); pm.expect(b.username).to.eql(pm.collectionVariables.get("testUsername")); pm.expect(b._links.author.href).to.include("/api/users/" + b.userId); });
      pm.collectionVariables.set("reviewId", b.id);
    language: text/javascript
order: 1000
