$kind: http-request
url: "{{baseUrl}}/api/albums/{{albumId}}/songs/999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Weird Fishes/Arpeggi",
      "trackNumber": 4,
      "durationSeconds": 318
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 404 Not Found", () => pm.response.to.have.status(404));
    language: text/javascript
order: 4000
