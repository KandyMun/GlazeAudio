$kind: http-request
url: "{{baseUrl}}/api/albums/{{albumId}}/songs/{{songId}}/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "authorName": "mantas",
      "lyricsRating": 4,
      "melodyRating": 9,
      "moodRating": 5,
      "expressivenessRating": 4,
      "comment": "The layered guitars build into something huge by the end."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 422 Unprocessable Entity", () => pm.response.to.have.status(422));
      pm.test("melodyRating reported", () => pm.expect(pm.response.json().errors).to.have.property("melodyRating"));
    language: text/javascript
order: 8000
