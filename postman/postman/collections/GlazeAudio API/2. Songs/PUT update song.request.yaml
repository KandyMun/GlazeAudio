$kind: http-request
url: "{{baseUrl}}/api/albums/{{albumId}}/songs/{{songId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Weird Fishes / Arpeggi",
      "trackNumber": 4,
      "durationSeconds": 318
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 OK", () => pm.response.to.have.status(200));
      pm.test("Content-Type is JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/(problem\+)?json/));
      pm.test("Title updated", () => pm.expect(pm.response.json().title).to.eql("Weird Fishes / Arpeggi"));
    language: text/javascript
order: 4000
