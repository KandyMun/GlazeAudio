$kind: http-request
url: "{{baseUrl}}/api/albums/{{albumId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "In Rainbows",
      "artist": "Radiohead",
      "releaseYear": 2007,
      "genre": "Art Rock",
      "coverUrl": "https://example.com/covers/in-rainbows.jpg"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 OK", () => pm.response.to.have.status(200));
      pm.test("Content-Type is JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/(problem\+)?json/));
      pm.test("Genre updated", () => pm.expect(pm.response.json().genre).to.eql("Art Rock"));
    language: text/javascript
order: 4000
