$kind: collection
description: |-
  Demonstrates all 15 GlazeAudio API methods (5 per resource: albums → songs → reviews) and the 400 / 404 / 422 / 201 / 204 cases.

  Run the whole collection with the Runner (or `newman run`). It creates its own album, song and review, then deletes them, so it can be re-run any number of times.
variables:
