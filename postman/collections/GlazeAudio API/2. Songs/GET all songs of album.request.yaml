$kind: http-request
url: "{{baseUrl}}/api/albums/{{albumId}}/songs"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 OK", () => pm.response.to.have.status(200));
      pm.test("Content-Type is JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/(problem\+)?json/));
      pm.test("Contains the new song", () => pm.expect(pm.response.json().items.map(s => s.id)).to.include(Number(pm.collectionVariables.get("songId"))));
    language: text/javascript
order: 2000
