$kind: http-request
url: "{{baseUrl}}/api/albums/{{albumId}}/songs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "title": "Oops", "trackNumber": "first", "durationSeconds": 100 }'
scripts:
  - type: afterResponse
    code: pm.test("Status 400 Bad Request", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
