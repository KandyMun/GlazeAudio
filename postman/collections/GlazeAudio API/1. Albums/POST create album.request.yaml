$kind: http-request
url: "{{baseUrl}}/api/albums"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "In Rainbows",
      "artist": "Radiohead",
      "releaseYear": 2007,
      "genre": "Alternative Rock",
      "coverUrl": "https://example.com/covers/in-rainbows.jpg"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201 Created", () => pm.response.to.have.status(201));
      pm.test("Content-Type is JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/(problem\+)?json/));
      const b = pm.response.json();
      pm.test("Location header points to new album", () => pm.expect(pm.response.headers.get("Location")).to.include("/api/albums/" + b.id));
      pm.test("Body echoes the album", () => pm.expect(b.title).to.eql("In Rainbows"));
      pm.test("Response has hypermedia links", () => pm.expect(b._links.songs.href).to.include("/api/albums/" + b.id + "/songs"));
      pm.collectionVariables.set("albumId", b.id);
      pm.collectionVariables.set("albumSongsUrl", b._links.songs.href);
    language: text/javascript
order: 2000
