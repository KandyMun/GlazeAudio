$kind: http-request
url: "{{baseUrl}}/api/albums/{{albumId}}/songs/{{songId}}/reviews/{{reviewId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "authorName": "mantas",
      "lyricsRating": 5,
      "melodyRating": 5,
      "moodRating": 5,
      "expressivenessRating": 4,
      "comment": "Changed my mind: the lyrics hold up too. One of the best songs on the album."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 OK", () => pm.response.to.have.status(200));
      pm.test("Content-Type is JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/(problem\+)?json/));
      const b = pm.response.json();
      pm.test("Rating and comment updated", () => { pm.expect(b.lyricsRating).to.eql(5); pm.expect(b.updatedAt).to.not.be.null; });
    language: text/javascript
order: 4000
