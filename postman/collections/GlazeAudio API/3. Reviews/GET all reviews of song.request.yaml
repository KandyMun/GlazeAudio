$kind: http-request
url: "{{baseUrl}}/api/albums/{{albumId}}/songs/{{songId}}/reviews"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 OK", () => pm.response.to.have.status(200));
      pm.test("Content-Type is JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/(problem\+)?json/));
      pm.test("Has one review", () => pm.expect(pm.response.json()).to.have.lengthOf(1));
    language: text/javascript
order: 2000
