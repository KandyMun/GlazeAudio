components:
  schemas:
    AlbumDto:
      required:
      - id
      - title
      - artist
      - releaseYear
      - genre
      - coverUrl
      - songCount
      - reviewCount
      - averageRating
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        artist:
          type: string
        releaseYear:
          type: integer
          format: int32
        genre:
          type: string
        coverUrl:
          type: string
          nullable: true
        songCount:
          type: integer
          format: int32
        reviewCount:
          type: integer
          format: int32
        averageRating:
          type: number
          format: double
          nullable: true
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
    AlbumOverviewDto:
      required:
      - album
      - stats
      - songs
      - topRatedSong
      - latestReviews
      type: object
      properties:
        album:
          $ref: '#/components/schemas/AlbumSummary'
        stats:
          $ref: '#/components/schemas/AlbumStats'
        songs:
          type: array
          items:
            $ref: '#/components/schemas/OverviewSong'
        topRatedSong:
          $ref: '#/components/schemas/OverviewSong2'
        latestReviews:
          type: array
          items:
            $ref: '#/components/schemas/OverviewReview'
        _links:
          type: object
          additionalProperties: {}
    AlbumRequest:
      required:
      - title
      - artist
      - releaseYear
      - genre
      - coverUrl
      type: object
      properties:
        title:
          maxLength: 200
          minLength: 1
          type: string
          nullable: true
        artist:
          maxLength: 200
          minLength: 1
          type: string
          nullable: true
        releaseYear:
          maximum: 2100
          minimum: 1900
          type: integer
          format: int32
          nullable: true
        genre:
          maxLength: 100
          minLength: 1
          type: string
          nullable: true
        coverUrl:
          maxLength: 500
          minLength: 0
          pattern: ^(https?://[^\s]+|/[^\s]*)$
          type: string
          nullable: true
    AlbumStats:
      required:
      - songCount
      - reviewCount
      - totalDurationSeconds
      - averageRating
      - aspectAverages
      type: object
      properties:
        songCount:
          type: integer
          format: int32
        reviewCount:
          type: integer
          format: int32
        totalDurationSeconds:
          type: integer
          format: int32
        averageRating:
          type: number
          format: double
          nullable: true
        aspectAverages:
          $ref: '#/components/schemas/AspectAverages'
    AlbumSummary:
      required:
      - id
      - title
      - artist
      - releaseYear
      - genre
      - coverUrl
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        artist:
          type: string
        releaseYear:
          type: integer
          format: int32
        genre:
          type: string
        coverUrl:
          type: string
          nullable: true
    ApiRoot:
      required:
      - name
      - version
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
    AspectAverages:
      required:
      - lyrics
      - melody
      - mood
      - expressiveness
      type: object
      properties:
        lyrics:
          type: number
          format: double
        melody:
          type: number
          format: double
        mood:
          type: number
          format: double
        expressiveness:
          type: number
          format: double
      nullable: true
    AuthResponse:
      required:
      - accessToken
      - accessTokenExpiresAt
      - refreshToken
      - refreshTokenExpiresAt
      - user
      type: object
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserDto'
        tokenType:
          type: string
          nullable: true
    ChangePasswordRequest:
      required:
      - currentPassword
      - newPassword
      type: object
      properties:
        currentPassword:
          maxLength: 100
          minLength: 1
          type: string
          nullable: true
        newPassword:
          maxLength: 100
          minLength: 8
          type: string
          nullable: true
    CreateReviewRequest:
      required:
      - lyricsRating
      - melodyRating
      - moodRating
      - expressivenessRating
      - comment
      type: object
      properties:
        lyricsRating:
          maximum: 5
          minimum: 0
          type: integer
          format: int32
          nullable: true
        melodyRating:
          maximum: 5
          minimum: 0
          type: integer
          format: int32
          nullable: true
        moodRating:
          maximum: 5
          minimum: 0
          type: integer
          format: int32
          nullable: true
        expressivenessRating:
          maximum: 5
          minimum: 0
          type: integer
          format: int32
          nullable: true
        comment:
          maxLength: 2000
          minLength: 1
          type: string
          nullable: true
    CreateUserRequest:
      required:
      - username
      - email
      - password
      - bio
      type: object
      properties:
        username:
          maxLength: 50
          minLength: 3
          pattern: ^[A-Za-z0-9_.-]+$
          type: string
          nullable: true
        email:
          maxLength: 200
          minLength: 0
          type: string
          nullable: true
        password:
          maxLength: 100
          minLength: 8
          type: string
          nullable: true
        bio:
          maxLength: 500
          minLength: 0
          type: string
          nullable: true
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Link:
      required:
      - href
      type: object
      properties:
        href:
          type: string
        method:
          type: string
          default: GET
    LoginRequest:
      required:
      - login
      - password
      type: object
      properties:
        login:
          maxLength: 200
          minLength: 1
          type: string
          nullable: true
        password:
          maxLength: 100
          minLength: 1
          type: string
          nullable: true
    OverviewReview:
      required:
