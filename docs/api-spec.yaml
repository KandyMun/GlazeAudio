  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Create an account and log in
      description: Creates an account with the User role and returns tokens, so the client is logged in right away. 409 if
        the username or email is taken.
      operationId: Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              Register:
                summary: Register
                value:
                  username: new_listener
                  email: new_listener@example.com
                  password: Listening123!
                  bio: Mostly jazz.
              Username_taken:
                summary: Username taken
                value:
                  username: mantas
                  email: other@example.com
                  password: Listening123!
              Validation_error:
                summary: Validation error
                value:
                  username: x
                  email: not-an-email
                  password: '123'
        required: true
      responses:
        '201':
          description: Created. The new resource is returned and the Location header points to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                Register:
                  summary: Register
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5…
                    accessTokenExpiresAt: '2026-11-12T21:32:16.1207792Z'
                    refreshToken: Kdc25aUgiuhew4N6EuCfD1ra…
                    refreshTokenExpiresAt: '2026-11-19T21:17:16.1210174Z'
                    user:
                      id: 7
                      username: new_listener
                      email: new_listener@example.com
                      role: User
                      bio: Mostly jazz.
                      createdAt: '2026-11-12T21:17:16.0567799Z'
                      reviewCount: 0
                      _links:
                        self:
                          href: http://localhost:5080/api/users/7
                          method: GET
                        update:
                          href: http://localhost:5080/api/users/7
                          method: PUT
                        delete:
                          href: http://localhost:5080/api/users/7
                          method: DELETE
                        reviews:
                          href: http://localhost:5080/api/users/7/reviews
                          method: GET
                        users:
                          href: http://localhost:5080/api/users
                          method: GET
                    tokenType: Bearer
          headers:
            Location:
              description: URL of the created resource.
              schema:
                type: string
                format: uri
        '400':
          description: Bad Request. The JSON body could not be read, or a query parameter is invalid (e.g. pageSize over 50).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                Malformed_JSON:
                  summary: Body is not valid JSON
                  value: *id001
        '409':
          description: 'Conflict. A duplicate: username or email taken, or the user already reviewed this song.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                Username_taken:
                  summary: Username taken
                  value:
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                    title: Username already taken.
                    status: 409
                    detail: The username 'mantas' is already in use.
        '422':
          description: Unprocessable Entity. Validation failed; `errors` lists the messages for each field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              examples:
                Validation_error:
                  summary: Validation error
                  value:
                    type: https://tools.ietf.org/html/rfc4918#section-11.2
                    title: One or more validation errors occurred.
                    status: 422
                    errors:
                      username:
                      - The field Username must be a string with a minimum length of 3 and a maximum length of 50.
                      email:
                      - The Email field is not a valid e-mail address.
                      password:
                      - The field Password must be a string with a minimum length of 8 and a maximum length of 100.
