# GlazeAudio API specification (OpenAPI 3.0).
# Generated from the running API (/openapi/v1.json); the examples are real requests and responses
# recorded against the demo data. View it at https://editor.swagger.io or import it into Postman.
openapi: 3.0.1
info:
  title: GlazeAudio API
  description: |-
    REST API for GlazeAudio, a platform for reviewing music. Resources are hierarchical: albums → songs → reviews; reviews are written by users.

    Authentication: log in with POST /api/auth/login and send the access token as `Authorization: Bearer <token>`. The token is a JWT (HS256) valid for 15 minutes and contains the user's id (`sub`), name and role (`role`: User or Admin). Use POST /api/auth/refresh with the refresh token to get a new one.

    Errors are returned as RFC 9457 problem details (`application/problem+json`).
  version: v1
servers:
- url: http://localhost:5080
  description: Local (dotnet run)
- url: https://{appName}.azurewebsites.net
  description: Azure App Service
  variables:
    appName:
      default: glazeaudio-api
      description: Name of the App Service (see infra/.deploy.env)
paths:
  /api:
    get:
      tags:
      - Root
      summary: API entry point with links to the main resources
      operationId: GetApiRoot
      responses:
        '200':
          description: OK. The resource (or page of resources) is returned as JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
              examples:
                API_root:
                  summary: API root
                  value:
                    name: GlazeAudio API
                    version: v1
                    _links:
                      self:
                        href: http://localhost:5080/api
                        method: GET
                      albums:
                        href: http://localhost:5080/api/albums
                        method: GET
                      createAlbum:
                        href: http://localhost:5080/api/albums
                        method: POST
                      register:
                        href: http://localhost:5080/api/auth/register
                        method: POST
                      login:
                        href: http://localhost:5080/api/auth/login
                        method: POST
                      refresh:
                        href: http://localhost:5080/api/auth/refresh
                        method: POST
                      me:
                        href: http://localhost:5080/api/auth/me
                        method: GET
                      docs:
                        href: http://localhost:5080/openapi/v1.json
                        method: GET
  /api/albums:
    get:
      tags:
      - Albums
      summary: List albums (paged, filterable)
      description: Returns one page of albums with their song count, review count and average rating. Filter with search,
        artist, genre, fromYear and toYear. Paging metadata and first/prev/next/last links are included in the response.
      operationId: GetAlbums
      parameters:
      - name: page
        in: query
        description: Page number, starting at 1. Default 1.
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: Items per page, 1–50. Default 10.
        schema:
          type: integer
          format: int32
      - name: search
        in: query
        description: Text to find in the album title or artist (case-insensitive).
        schema:
          type: string
      - name: artist
        in: query
        description: Only albums whose artist contains this text.
        schema:
          type: string
      - name: genre
        in: query
        description: Only albums whose genre contains this text, e.g. 'rock'.
        schema:
          type: string
      - name: fromYear
        in: query
        description: Only albums released in or after this year.
        schema:
          type: integer
          format: int32
      - name: toYear
        in: query
        description: Only albums released in or before this year.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK. The resource (or page of resources) is returned as JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfAlbumDto'
              examples:
                Paged_filtered_list:
                  summary: Paged, filtered list
                  value:
                    items:
                    - id: 2
                      title: Random Access Memories
                      artist: Daft Punk
                      releaseYear: 2013
                      genre: Electronic / Disco
                      coverUrl: /covers/ink-speckle.jpg
                      songCount: 4
                      reviewCount: 5
                      averageRating: 3.95
                      _links:
                        self:
                          href: http://localhost:5080/api/albums/2
                          method: GET
                        update:
                          href: http://localhost:5080/api/albums/2
                          method: PUT
                        delete:
                          href: http://localhost:5080/api/albums/2
                          method: DELETE
                        songs:
                          href: http://localhost:5080/api/albums/2/songs
                          method: GET
                        createSong:
                          href: http://localhost:5080/api/albums/2/songs
                          method: POST
                        overview:
                          href: http://localhost:5080/api/albums/2/overview
                          method: GET
                        albums:
                          href: http://localhost:5080/api/albums
                          method: GET
                    - id: 3
                      title: To Pimp a Butterfly
                      artist: Kendrick Lamar
                      releaseYear: 2015
                      genre: Hip-Hop / Jazz Rap
                      coverUrl: /covers/ochre-crackle.jpg
                      songCount: 4
                      reviewCount: 5
                      averageRating: 4.45
                      _links:
                        self:
                          href: http://localhost:5080/api/albums/3
                          method: GET
                        update:
                          href: http://localhost:5080/api/albums/3
                          method: PUT
                        delete:
                          href: http://localhost:5080/api/albums/3
                          method: DELETE
                        songs:
                          href: http://localhost:5080/api/albums/3/songs
                          method: GET
                        createSong:
                          href: http://localhost:5080/api/albums/3/songs
                          method: POST
                        overview:
                          href: http://localhost:5080/api/albums/3/overview
                          method: GET
                        albums:
                          href: http://localhost:5080/api/albums
                          method: GET
                    page: 1
                    pageSize: 2
                    totalCount: 3
                    totalPages: 2
                    _links:
                      self:
                        href: http://localhost:5080/api/albums?fromYear=2010&page=1&pageSize=2
                        method: GET
                      first:
                        href: http://localhost:5080/api/albums?fromYear=2010&page=1&pageSize=2
                        method: GET
                      last:
                        href: http://localhost:5080/api/albums?fromYear=2010&page=2&pageSize=2
                        method: GET
                      next:
                        href: http://localhost:5080/api/albums?fromYear=2010&page=2&pageSize=2
                        method: GET
        '400':
          description: Bad Request. The JSON body could not be read, or a query parameter is invalid (e.g. pageSize over 50).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              examples:
                Invalid_paging:
                  summary: Invalid paging
                  value:
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                    title: Invalid query parameters.
                    status: 400
                    errors:
                      pageSize:
                      - pageSize must be between 1 and 50.
    post:
      tags:
      - Albums
      summary: Create an album (admin)
      description: Creates a new album. Returns 201 with a Location header that points to the new album.
      operationId: CreateAlbum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumRequest'
            examples:
              Create_admin:
                summary: Create (admin)
                value:
                  title: In Rainbows
                  artist: Radiohead
                  releaseYear: 2007
                  genre: Alternative Rock
                  coverUrl: /covers/teal-bloom.jpg
              Not_logged_in:
                summary: Not logged in
                value:
                  title: In Rainbows
                  artist: Radiohead
                  releaseYear: 2007
                  genre: Alternative Rock
                  coverUrl: /covers/teal-bloom.jpg
              Not_an_admin:
                summary: Not an admin
                value:
                  title: In Rainbows
                  artist: Radiohead
                  releaseYear: 2007
                  genre: Alternative Rock
                  coverUrl: /covers/teal-bloom.jpg
              Validation_error:
                summary: Validation error
                value:
                  title: ''
                  artist: Radiohead
                  releaseYear: 1800
                  genre: Rock
                  coverUrl: not a link
        required: true
      responses:
        '201':
          description: Created. The new resource is returned and the Location header points to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDto'
              examples:
                Create_admin:
                  summary: Create (admin)
                  value:
                    id: 6
                    title: In Rainbows
                    artist: Radiohead
                    releaseYear: 2007
                    genre: Alternative Rock
                    coverUrl: /covers/teal-bloom.jpg
                    songCount: 0
                    reviewCount: 0
                    averageRating: null
                    _links:
                      self:
                        href: http://localhost:5080/api/albums/6
                        method: GET
                      update:
                        href: http://localhost:5080/api/albums/6
                        method: PUT
                      delete:
                        href: http://localhost:5080/api/albums/6
                        method: DELETE
                      songs:
                        href: http://localhost:5080/api/albums/6/songs
                        method: GET
                      createSong:
                        href: http://localhost:5080/api/albums/6/songs
                        method: POST
                      overview:
                        href: http://localhost:5080/api/albums/6/overview
                        method: GET
                      albums:
                        href: http://localhost:5080/api/albums
                        method: GET
          headers:
            Location:
              description: URL of the created resource.
              schema:
                type: string
                format: uri
        '400':
          description: Bad Request. The JSON body could not be read, or a query parameter is invalid (e.g. pageSize over 50).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                Malformed_JSON:
                  summary: Body is not valid JSON
                  value: &id001
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                    title: The request could not be read.
                    status: 400
                    detail: 'The JSON payload is invalid: ''b'' is an invalid start of a property name. Expected a ''"''.
                      Path: $ | LineNumber: 0 | BytePositionInLine: 1.'
        '401':
          description: 'Unauthorized. The access token is missing, invalid or expired (for /auth endpoints: wrong login or
            refresh token).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                Not_logged_in:
                  summary: Not logged in
                  value:
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                    title: Authentication required.
                    status: 401
                    detail: 'Log in and send the access token as ''Authorization: Bearer <token>''.'
        '403':
          description: 'Forbidden. Logged in, but not allowed: admin-only action, or the resource belongs to someone else.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                Not_an_admin:
                  summary: Not an admin
                  value:
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.4
                    title: Forbidden.
                    status: 403
                    detail: Your role does not allow this action.
        '422':
          description: Unprocessable Entity. Validation failed; `errors` lists the messages for each field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              examples:
                Validation_error:
                  summary: Validation error
                  value:
                    type: https://tools.ietf.org/html/rfc4918#section-11.2
                    title: One or more validation errors occurred.
                    status: 422
                    errors:
                      title:
                      - The Title field is required.
                      releaseYear:
                      - The field ReleaseYear must be between 1900 and 2100.
                      coverUrl:
                      - Cover URL must be an http(s) address or a path starting with '/'.
      security:
      - Bearer: []
